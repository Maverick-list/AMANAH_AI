<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" fill="none" role="img" aria-label="Problem Mechanism Diagram - AMANAH AI">
  <rect width="920" height="360" rx="16" fill="#FAF8F3" stroke="#D6D3C9" stroke-width="1.5"/>
  <!-- Header Banner -->
  <rect x="24" y="20" width="872" height="48" rx="10" fill="#064E3B"/>
  <text x="44" y="49" fill="#FAF8F3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">MEKANISME MASALAH: MENGAPA PENGGUNA TERJEBAK PESAN TRANSAKSI MENCURIGAKAN</text>
  <text x="876" y="49" text-anchor="end" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12">PROBLEM-MECHANISM</text>

  <!-- Stage 1 -->
  <g transform="translate(24, 90)">
    <rect width="200" height="175" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#ECFDF5"/>
    <text x="43" y="32" text-anchor="middle" fill="#047857" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11">TAHAP 01</text>
    <text x="16" y="62" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Paparan Pesan Manipulatif</text>
    <text x="16" y="86" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Klaim hadiah / kerja instan</text>
    <text x="16" y="106" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Ancaman blokir akun / OTP</text>
    <text x="16" y="126" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Permintaan biaya admin</text>
    <text x="16" y="146" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Ajakan pindah ke luar aplikasi</text>
  </g>

  <!-- Arrow 1->2 -->
  <path d="M228 177H244" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  <path d="M240 172L246 177L240 182" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 2 -->
  <g transform="translate(248, 90)">
    <rect width="200" height="175" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#FEF3C7"/>
    <text x="43" y="32" text-anchor="middle" fill="#B45309" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11">TAHAP 02</text>
    <text x="16" y="62" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Tekanan Kognitif &amp; Waktu</text>
    <text x="16" y="86" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Batas waktu sempit (urgensi)</text>
    <text x="16" y="106" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Ilusi otoritas / atribut resmi</text>
    <text x="16" y="126" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Kelelahan informasi digital</text>
    <text x="16" y="146" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Fokus pada janji keuntungan</text>
  </g>

  <!-- Arrow 2->3 -->
  <path d="M452 177H468" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  <path d="M464 172L470 177L464 182" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 3 -->
  <g transform="translate(472, 90)">
    <rect width="200" height="175" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="16" y="16" width="54" height="24" rx="6" fill="#FEF3C7"/>
    <text x="43" y="32" text-anchor="middle" fill="#B45309" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11">TAHAP 03</text>
    <text x="16" y="62" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Absennya Jeda Verifikasi</text>
    <text x="16" y="86" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Menghubungi nomor di pesan</text>
    <text x="16" y="106" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Tidak cek kanal resmi mandiri</text>
    <text x="16" y="126" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">• Mengabaikan kejanggalan</text>
    <text x="16" y="146" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">  instruksi pembayaran</text>
  </g>

  <!-- Arrow 3->4 -->
  <path d="M676 177H692" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  <path d="M688 172L694 177L688 182" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 4: AMANAH AI Intervention -->
  <g transform="translate(696, 90)">
    <rect width="200" height="175" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
    <rect x="16" y="16" width="110" height="24" rx="6" fill="#047857"/>
    <text x="71" y="32" text-anchor="middle" fill="#FAF8F3" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11">INTERVENSI AMANAH</text>
    <text x="16" y="62" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Jeda Reflektif &amp; Mandiri</text>
    <text x="16" y="86" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✓ Sorot bukti teks spesifik</text>
    <text x="16" y="106" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✓ Jelaskan alasan &amp; batasan</text>
    <text x="16" y="126" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✓ Pandu verifikasi saluran resmi</text>
    <text x="16" y="146" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✓ Bangun literasi jangka panjang</text>
  </g>

  <!-- Bottom Takeaway Bar -->
  <rect x="24" y="284" width="872" height="52" rx="10" fill="#F3F0E6" stroke="#D6D3C9"/>
  <text x="44" y="315" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">Prinsip Inti: AMANAH AI memutus rantai reaktif antara Tahap 02 dan Tahap 03 dengan menghadirkan jeda analitis berbasis bukti teks.</text>
