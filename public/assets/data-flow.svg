<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" fill="none" role="img" aria-label="Data Flow and Privacy Boundary Diagram - AMANAH AI">
  <rect width="920" height="340" rx="16" fill="#FAF8F3" stroke="#D6D3C9" stroke-width="1.5"/>
  <!-- Title -->
  <rect x="24" y="20" width="872" height="46" rx="10" fill="#064E3B"/>
  <text x="44" y="48" fill="#FAF8F3" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">ALUR DATA &amp; BATAS PRIVASI (DATA FLOW &amp; PRIVACY BOUNDARY)</text>
  <text x="876" y="48" text-anchor="end" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="12">DATA-FLOW.SVG</text>

  <!-- Browser Trust Boundary Box -->
  <rect x="24" y="82" width="600" height="234" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
  <text x="44" y="108" fill="#064E3B" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12">BATAS KEPERCAYAAN LOKAL: PERAMBAN PENGGUNA (LOCAL BROWSER MEMORY)</text>

  <!-- Box 1: User Input -->
  <rect x="44" y="126" width="165" height="118" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
  <text x="58" y="152" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">1. Teks Masukan</text>
  <text x="58" y="174" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">• Dihapus PII oleh</text>
  <text x="58" y="190" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">  pengguna</text>
  <text x="58" y="208" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">• Diperlakukan sebagai</text>
  <text x="58" y="224" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">  plain-text murni</text>

  <path d="M213 185H235" stroke="#047857" stroke-width="2"/>

  <!-- Box 2: Local Processing -->
  <rect x="239" y="126" width="165" height="118" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
  <text x="253" y="152" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">2. Analisis Lokal</text>
  <text x="253" y="174" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">• Pencocokan aturan</text>
  <text x="253" y="190" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">  di memori RAM</text>
  <text x="253" y="208" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">• Tanpa penyimpanan</text>
  <text x="253" y="224" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">  server / cloud</text>

  <path d="M408 185H430" stroke="#047857" stroke-width="2"/>

  <!-- Box 3: Purge / Reset -->
  <rect x="434" y="126" width="170" height="118" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
  <text x="448" y="152" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">3. Kendali Hapus</text>
  <text x="448" y="174" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">• Tombol Hapus Analisis</text>
  <text x="448" y="190" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">  membersihkan state</text>
  <text x="448" y="208" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">• Hilang otomatis saat</text>
  <text x="448" y="224" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">  tab ditutup</text>

  <text x="44" y="280" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12">✓ Zero External Telemetry: Pesan mentah tidak pernah meninggalkan perangkat pengguna.</text>

  <!-- Blocked External Zone -->
  <g transform="translate(652, 82)">
    <rect width="244" height="234" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="20" y="32" fill="#4B5563" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11.5">ZONA EKSTERNAL (DIBLOKIR)</text>
    <text x="20" y="66" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✕ Tidak ada penyimpanan DB</text>
    <text x="20" y="94" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✕ Tidak ada pengiriman ke pihak ke-3</text>
    <text x="20" y="122" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✕ Tidak membuka URL di pesan</text>
    <text x="20" y="150" fill="#374151" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">✕ Tidak ada pelacakan iklan</text>
    <rect x="20" y="174" width="204" height="42" rx="8" fill="#F3F0E6" stroke="#D6D3C9"/>
    <text x="32" y="199" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11.5">Privasi secara Desain (Default)</text>
  </g>
</svg>
